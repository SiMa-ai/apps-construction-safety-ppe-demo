[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-construction-safety-demo"
version = "0.1.0"
description = "Construction-site incident monitoring with camera and zone controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.4.155",
    "numpy>=1.23,<2",
    "opencv-python>=4.7",
]

[project.optional-dependencies]
dev = ["ruff==0.11.13"]
model-prep = ["onnx==1.17.0", "onnxruntime==1.21.1"]
world = ["clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7"]

[tool.setuptools.packages.find]
include = ["construction_safety*"]

[tool.setuptools.package-data]
construction_safety = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
required-version = "==0.11.13"
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These standalone CLI scripts add the project root before importing the package.
"scripts/benchmark_detectors.py" = ["E402"]
"scripts/check_detector.py" = ["E402"]
